<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PCOSense Sanjivani</title>
  <meta name="description" content="PCOSense Sanjivani: An AI-Powered Digital Screening Framework for Early PCOS Risk Detection in Adolescents" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-a:        #fdf2f8;
      --bg-b:        #eef2ff;
      --surface:     #ffffff;
      --bot-bg:      #f1f5f9;
      --bot-text:    #1e2a3a;
      --user-bg:     linear-gradient(135deg, #a78bfa, #818cf8);
      --user-text:   #ffffff;
      --accent:      #8b5cf6;
      --accent-2:    #ec4899;
      --accent-dark: #6d28d9;
      --btn-yes:     linear-gradient(135deg, #34d399, #10b981);
      --btn-no:      linear-gradient(135deg, #f472b6, #ec4899);
      --btn-text:    #ffffff;
      --footer-bg:   #faf7ff;
      --footer-text: #6b6480;
      --border:      #e5e0f5;
      --radius:      20px;
      --font-head:   'Poppins', system-ui, sans-serif;
      --font-body:   'Inter', 'Noto Sans Devanagari', system-ui, sans-serif;
    }

    html, body { height: 100%; }
    body {
      font-family: var(--font-body);
      background: linear-gradient(160deg, var(--bg-a) 0%, var(--bg-b) 100%);
      background-attachment: fixed;
      color: var(--bot-text);
      display: flex;
      justify-content: center;
      min-height: 100dvh;
    }

    #app-shell {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      background: var(--surface);
      box-shadow: 0 0 60px rgba(139, 92, 246, .08);
      position: relative;
    }
    @media (min-width: 700px) {
      body { padding: 28px 0; }
      #app-shell {
        min-height: calc(100dvh - 56px);
        border-radius: 28px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(109, 40, 217, .16), 0 2px 10px rgba(0,0,0,.04);
      }
    }

    header {
      background: linear-gradient(120deg, #8b5cf6, #a78bfa 55%, #ec4899);
      color: #fff;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header .avatar {
      width: 46px; height: 46px; min-width: 46px;
      border-radius: 50%;
      overflow: hidden;
      border: 2.5px solid rgba(255,255,255,.85);
      box-shadow: 0 4px 14px rgba(0,0,0,.2);
      background: #fff;
    }
    header .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    header .titles { flex: 1; min-width: 0; }
    header h1 { font-family: var(--font-head); font-size: 1.02rem; font-weight: 600; line-height: 1.2; }
    header p  { font-size: .74rem; opacity: .92; margin-top: 2px; }

    #lang-toggle {
      display: flex;
      background: rgba(255,255,255,.18);
      border-radius: 20px;
      padding: 3px;
      gap: 2px;
      flex-shrink: 0;
    }
    #lang-toggle button {
      border: none;
      background: transparent;
      color: #fff;
      font-family: var(--font-body);
      font-size: .72rem;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 16px;
      cursor: pointer;
      opacity: .8;
    }
    #lang-toggle button.active { background: #fff; color: var(--accent-dark); opacity: 1; }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 22px 16px 160px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }

    .bubble-row { display: flex; align-items: flex-end; gap: 9px; animation: fadeUp .32s cubic-bezier(.22,1,.36,1) both; }
    .bubble-row.bot  { justify-content: flex-start; }
    .bubble-row.user { justify-content: flex-end; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    .bot-icon {
      width: 32px; height: 32px; min-width: 32px;
      border-radius: 50%; overflow: hidden; border: 2px solid #fff;
      align-self: flex-end; box-shadow: 0 2px 8px rgba(139,92,246,.28); flex-shrink: 0;
    }
    .bot-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .bubble {
      max-width: min(78vw, 440px);
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: .95rem;
      line-height: 1.55;
      word-break: break-word;
      box-shadow: 0 1px 2px rgba(30,41,59,.04);
    }
    .bubble-row.bot  .bubble { background: var(--bot-bg); color: var(--bot-text); border-bottom-left-radius: 6px; }
    .bubble-row.user .bubble { background: var(--user-bg); color: var(--user-text); border-bottom-right-radius: 6px; box-shadow: 0 4px 14px rgba(139,92,246,.25); }

    .bubble.info { background: linear-gradient(160deg, #fff7ed, #fef3f9); border: 1.5px solid #fed7aa; }
    .bubble.result { background: linear-gradient(160deg, #f5f3ff, #fdf2f8); border: 1.5px solid #ddd6fe; animation: resultReveal 1.1s cubic-bezier(.22,1,.36,1) both; }
    @keyframes resultReveal {
      0%   { opacity: 0; transform: translateY(10px) scale(.97); box-shadow: 0 0 0 rgba(139,92,246,0); }
      55%  { opacity: 1; transform: translateY(0) scale(1.01); box-shadow: 0 0 22px rgba(139,92,246,.22); }
      100% { opacity: 1; transform: translateY(0) scale(1); box-shadow: 0 1px 2px rgba(30,41,59,.04); }
    }

    .why-toggle {
      display: block; margin-top: 12px; font-size: .8rem; font-weight: 600; color: var(--accent-dark);
      cursor: pointer; background: #fff; border: 1px solid #ddd6fe; border-radius: 20px; padding: 6px 14px;
      font-family: inherit; text-align: left; width: fit-content;
    }
    .why-toggle:hover { background: #f5f3ff; }
    .why-text { margin-top: 8px; font-size: .82rem; color: #4c3a75; background: #ffffffaa; border-radius: 12px; padding: 10px 12px; border: 1px dashed #ddd6fe; }

    .typing { display: flex; gap: 5px; padding: 14px 16px; }
    .typing span { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); opacity: .55; animation: bounce .9s infinite; }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .30s; }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

    #tray {
      position: sticky; bottom: 0;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex; flex-direction: column; gap: 9px;
      z-index: 9;
      margin-top: auto;
    }
    #tray.hidden { display: none; }

    .yn-row { display: flex; gap: 10px; }
    .yn-btn {
      flex: 1; padding: 13px; border: none; border-radius: 14px;
      font-size: 1rem; font-weight: 600; font-family: var(--font-body);
      cursor: pointer; transition: filter .15s, transform .1s;
    }
    .yn-btn:active { transform: scale(.96); }
    .yn-btn.yes { background: var(--btn-yes); color: var(--btn-text); box-shadow: 0 4px 12px rgba(16,185,129,.28); }
    .yn-btn.no  { background: var(--btn-no);  color: var(--btn-text); box-shadow: 0 4px 12px rgba(236,72,153,.24); }
    .yn-btn:hover { filter: brightness(1.06); }

    .row-flex { display: flex; gap: 8px; align-items: center; }
    .row-flex input[type="number"], .row-flex input[type="text"] {
      flex: 1; padding: 12px 15px; border: 2px solid var(--border); border-radius: 14px;
      font-size: 1rem; font-family: var(--font-body); color: var(--bot-text); background: var(--surface);
      transition: border-color .2s, box-shadow .2s;
    }
    .row-flex input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(139,92,246,.12); outline: none; }

    .submit-btn {
      padding: 12px 22px; background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #fff; border: none; border-radius: 14px; font-size: 1rem; font-weight: 600;
      font-family: var(--font-body); cursor: pointer; box-shadow: 0 4px 14px rgba(139,92,246,.32);
    }
    .submit-btn:hover { filter: brightness(1.08); }
    .submit-btn:active { transform: scale(.96); }

    .hint { font-size: .78rem; color: #8b83a3; text-align: center; }
    .inline-error { color: #c62828 !important; }

    footer {
      background: var(--footer-bg); border-top: 1px solid var(--border);
      padding: 10px 16px; font-size: .66rem; color: var(--footer-text);
      text-align: center; line-height: 1.5;
    }
    .parent-link {
      display: inline-block; margin-top: 6px; background: none; border: none;
      color: var(--accent-dark); font-weight: 700; font-size: .72rem;
      cursor: pointer; text-decoration: underline; font-family: var(--font-body);
    }

    /* ── Parent / Guardian info modal ── */
    #parent-overlay {
      position: fixed; inset: 0; background: rgba(30,20,50,.45); z-index: 40;
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    #parent-overlay.open { display: flex; }
    #parent-modal {
      background: var(--surface); border-radius: 20px; max-width: 480px; width: 100%;
      max-height: 82vh; overflow-y: auto; padding: 26px 24px; position: relative;
      box-shadow: 0 24px 70px rgba(0,0,0,.28);
      animation: modalIn .28s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes modalIn { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: scale(1); } }
    #parent-modal h2 { font-family: var(--font-head); font-size: 1.25rem; color: var(--accent-dark); margin-bottom: 14px; padding-right: 24px; }
    #parent-modal p { font-size: .92rem; line-height: 1.6; color: var(--bot-text); margin-bottom: 14px; }
    #parent-modal .parent-close {
      position: absolute; top: 14px; right: 16px; background: none; border: none;
      font-size: 1.3rem; cursor: pointer; color: var(--footer-text); line-height: 1;
    }
    #parent-modal .parent-ok {
      display: block; width: 100%; margin-top: 6px; padding: 12px; border: none;
      border-radius: 14px; background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #fff; font-weight: 600; font-size: .95rem; cursor: pointer; font-family: var(--font-body);
    }

    .error-bubble { background: #fff7ed; border: 1.5px solid #fdba74; color: #7c3a00; }

    .restart-btn {
      margin-top: 12px; padding: 11px 24px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff; border: none; border-radius: 14px; font-size: .9rem; font-weight: 600;
      font-family: var(--font-body); cursor: pointer; box-shadow: 0 4px 14px rgba(139,92,246,.3);
    }

  </style>
</head>
<body>

<div id="app-shell">
  <header>
    <div class="avatar" aria-hidden="true"><img src="doctor_avatar.jpg" alt="Friendly doctor avatar" /></div>
    <div class="titles">
      <h1>PCOSense Sanjivani</h1>
      <p>An AI-Powered Digital Screening Framework for Early PCOS Risk Detection in Adolescents</p>
    </div>
    <div id="lang-toggle">
      <button id="lang-en" class="active" onclick="setLangUI('en')">EN</button>
      <button id="lang-mr" onclick="setLangUI('mr')">मराठी</button>
    </div>
  </header>

  <main id="chat" role="log" aria-live="polite" aria-label="Chat conversation"></main>
  <div id="tray" class="hidden" role="form" aria-label="Answer input"></div>

  <footer>
    A student-built educational project — not a medical device.
    <br/>
    <button class="parent-link" id="parent-link-btn" onclick="toggleParentInfo(true)">👪 For Parents & Guardians</button>
  </footer>
</div>

<div id="parent-overlay" onclick="if(event.target===this) toggleParentInfo(false)">
  <div id="parent-modal">
    <button class="parent-close" onclick="toggleParentInfo(false)" aria-label="Close">✕</button>
    <h2 id="parent-modal-title">For Parents &amp; Guardians</h2>
    <div id="parent-modal-body"></div>
    <button class="parent-ok" id="parent-ok-btn" onclick="toggleParentInfo(false)">Got it</button>
  </div>
</div>

   ═══════════════════════════════════════════════════════════════ */

const tray = document.getElementById("tray");

function addBubble(text, who = "bot", extraClass = "") {
  const row = document.createElement("div");
  row.className = `bubble-row ${who}`;
  if (who === "bot") {
    const icon = document.createElement("div");
    icon.className = "bot-icon";
    icon.innerHTML = `<img src="doctor_avatar.jpg" alt="Doctor" />`;
    row.appendChild(icon);
  }
  const bubble = document.createElement("div");
  bubble.className = `bubble${extraClass ? " " + extraClass : ""}`;
  bubble.innerHTML = text;
  row.appendChild(bubble);
  chat.appendChild(row);
  scrollToBottom();
  return bubble;
}
function addUserBubble(text) { addBubble(escapeHtml(text), "user"); }
function escapeHtml(str) {
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function scrollToBottom() { chat.scrollTop = chat.scrollHeight; }

function showTyping() {
  const row = document.createElement("div");
  row.className = "bubble-row bot";
  row.id = "typing-indicator";
  const icon = document.createElement("div");
  icon.className = "bot-icon";
  icon.innerHTML = `<img src="doctor_avatar.jpg" alt="Doctor" />`;
  row.appendChild(icon);
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
  row.appendChild(bubble);
  chat.appendChild(row);
  scrollToBottom();
}
function removeTyping() { const el = document.getElementById("typing-indicator"); if (el) el.remove(); }
function clearTray() { tray.innerHTML = ""; tray.classList.add("hidden"); }

/* ─── Remember this device ─── */
const DEVICE_KEY = "pcosense_user";
function loadDevice() { try { return JSON.parse(localStorage.getItem(DEVICE_KEY)); } catch (e) { return null; } }
function saveDevice(code, name) { try { localStorage.setItem(DEVICE_KEY, JSON.stringify({ code, name })); } catch (e) {} }
function clearDevice() { try { localStorage.removeItem(DEVICE_KEY); } catch (e) {} }

function snapshotFrom(data) {
  const last = data.history[data.history.length - 1];
  return { date: last.date, band: last.band, answers: data.last_answers || {} };
}

function bandWord(b) { return b === "some_indicators" ? UI[currentLang].bandSome : UI[currentLang].bandLow; }

function buildComparison(data) {
  const t = UI[currentLang], labels = SUM[currentLang].labels, prev = prevSnapshot;
  let verdict = t.cmpSame;
  if (prev.band === "some_indicators" && data.band === "low_indicators") verdict = t.cmpBetter;
  else if (prev.band === "low_indicators" && data.band === "some_indicators") verdict = t.cmpMore;
  const better = [], fresh = [];
  Object.keys(labels).forEach(k => {
    if (typeof answers[k] !== "boolean" || typeof prev.answers[k] !== "boolean") return;
    if (prev.answers[k] && !answers[k]) better.push(labels[k]);
    if (!prev.answers[k] && answers[k]) fresh.push(labels[k]);
  });
  let html = `<strong>${t.cmpTitle}</strong><br/>${t.lastTime} (${escapeHtml(prev.date)}): <strong>${bandWord(prev.band)}</strong><br/>` +
             `${t.now}: <strong>${bandWord(data.band)}</strong><br/><br/>${verdict}`;
  if (better.length) html += `<br/><br/>${t.cmpBetterSym}: ${better.map(escapeHtml).join(", ")}`;
  if (fresh.length) html += `<br/>${t.cmpNewSym}: ${fresh.map(escapeHtml).join(", ")}`;
  return html;
}

async function submitCode(input) {
  const code = input.value.trim().toUpperCase();
  if (!code) { shakeInput(input); return; }
  clearTray();
  addUserBubble(code);
  showTyping();
  try {
    const res = await fetch(`${API_BASE}/trend/${code}`);
    removeTyping();
    if (!res.ok) {
      addBubble(escapeHtml(UI[currentLang].codeNotFound));
      setTimeout(askFamiliarity, 700);
      return;
    }
    const data = await res.json();
    trackingCode = code;
    prevSnapshot = snapshotFrom(data);

    const lines = data.history.map((h, i) =>
      `${i + 1}. ${h.date} — <strong>${h.band === "some_indicators" ? (currentLang === "en" ? "some indicators" : "काही निर्देशक") : (currentLang === "en" ? "low indicators" : "कमी निर्देशक")}</strong>`
    ).join("<br/>");
    addBubble(`${escapeHtml(UI[currentLang].trendIntro)}<br/><br/>${lines}`, "bot", "info");

    setTimeout(() => {
      showTyping();
      setTimeout(() => {
        removeTyping();
        addBubble(escapeHtml(UI[currentLang].trendContinue));
        tray.innerHTML = ""; tray.classList.remove("hidden");
        const row = document.createElement("div");
        row.className = "yn-row";
        const yes = document.createElement("button");
        yes.className = "yn-btn yes"; yes.textContent = UI[currentLang].yes;
        yes.onclick = () => { clearTray(); addUserBubble(UI[currentLang].yes); askFamiliarity(); };
        const no = document.createElement("button");
        no.className = "yn-btn no"; no.textContent = UI[currentLang].no;
        no.onclick = () => {
          clearTray(); addUserBubble(UI[currentLang].no);
          const restartRow = document.createElement("div");
          restartRow.style.textAlign = "center";
          const rb = document.createElement("button");
          rb.className = "restart-btn"; rb.textContent = UI[currentLang].restart;
          rb.onclick = restartApp;
          restartRow.appendChild(rb);
          chat.appendChild(restartRow);
          scrollToBottom();
        };
        row.appendChild(yes); row.appendChild(no);
        tray.appendChild(row);
      }, 700);
    }, 600);
  } catch (e) {
    removeTyping();
    addBubble(UI[currentLang].connError, "bot", "error-bubble");
  }
}

function askFamiliarity() {
  showTyping();
  setTimeout(() => {
    removeTyping();
    addBubble(escapeHtml(UI[currentLang].familiarQ));
    tray.innerHTML = ""; tray.classList.remove("hidden");
    const row = document.createElement("div");
    row.className = "yn-row";
    const yes = document.createElement("button");
    yes.className = "yn-btn yes"; yes.textContent = UI[currentLang].yes;
    yes.onclick = () => { clearTray(); addUserBubble(UI[currentLang].yes); askName(); };
    const no = document.createElement("button");
    no.className = "yn-btn no"; no.textContent = UI[currentLang].no;
    no.onclick = () => { clearTray(); addUserBubble(UI[currentLang].no); showPcosBrief(); };
    row.appendChild(yes); row.appendChild(no);
    tray.appendChild(row);
  }, 600);
}

async function showPcosBrief() {
  showTyping();
  try {
    const res = await fetch(`${API_BASE}/pcos-info?lang=${currentLang}`);
    const data = await res.json();
    removeTyping();
    addBubble(escapeHtml(data.info), "bot", "info");
    setTimeout(askName, 700);
  } catch (e) {
    removeTyping();
    askName(); // don't block the flow if this one call fails
  }
}

function askName() {
  showTyping();
  setTimeout(() => {
    removeTyping();
    addBubble(escapeHtml(UI[currentLang].nameQ));
    tray.innerHTML = ""; tray.classList.remove("hidden");
    const row = document.createElement("div");
    row.className = "row-flex";
    const input = document.createElement("input");
    input.type = "text"; input.maxLength = 30;
    input.placeholder = UI[currentLang].namePlaceholder;
    input.addEventListener("keydown", e => { if (e.key === "Enter") submitName(input); });
    const btn = document.createElement("button");
    btn.className = "submit-btn"; btn.textContent = "→";
    btn.onclick = () => submitName(input);
    row.appendChild(input); row.appendChild(btn);
    tray.appendChild(row);
    setTimeout(() => input.focus(), 200);
  }, 500);
}

function submitName(input) {
  const val = input.value.trim();
  userName = val || "Friend";
  clearTray();
  addUserBubble(val || (currentLang === "en" ? "(skipped)" : "(वगळले)"));
  showReadyMessage();
}

function showReadyMessage() {
  showTyping();
  setTimeout(() => {
    removeTyping();
    const greetPrefix = userName !== "Friend" ? `${escapeHtml(userName)}! ` : "";
    addBubble(greetPrefix + escapeHtml(UI[currentLang].readyMsg));
    tray.innerHTML = ""; tray.classList.remove("hidden");
    const btn = document.createElement("button");
    btn.className = "submit-btn"; btn.style.width = "100%"; btn.style.fontSize = "1.05rem";
    btn.textContent = UI[currentLang].letsGo;
    btn.onclick = () => { clearTray(); addUserBubble(UI[currentLang].letsGo); advanceStep(); };
    tray.appendChild(btn);
    scrollToBottom();
  }, 700);
}

/* ═══════════════════════════════════════════════════════════════
   Structured question flow
   ═══════════════════════════════════════════════════════════════ */
function renderTray(step) {
  tray.innerHTML = ""; tray.classList.remove("hidden");
  if (step.type === "bool") {
    const row = document.createElement("div");
    row.className = "yn-row";
    const yes = document.createElement("button");
    yes.className = "yn-btn yes"; yes.textContent = UI[currentLang].yes;
    yes.onclick = () => submitBool(step, true);
    const no = document.createElement("button");
    no.className = "yn-btn no"; no.textContent = UI[currentLang].no;
    no.onclick = () => submitBool(step, false);
    row.appendChild(yes); row.appendChild(no);
    tray.appendChild(row);
  } else {
    const row = document.createElement("div");
    row.className = "row-flex";
    const input = document.createElement("input");
    input.type = "number"; input.min = step.min; input.max = step.max; input.step = step.step;
    input.placeholder = step.hint[currentLang];
    input.addEventListener("keydown", e => { if (e.key === "Enter") submitNum(step, input); });
    const btn = document.createElement("button");
    btn.className = "submit-btn"; btn.textContent = "→";
    btn.onclick = () => submitNum(step, input);
    row.appendChild(input); row.appendChild(btn);
    tray.appendChild(row);
    const hint = document.createElement("p");
    hint.className = "hint"; hint.textContent = step.hint[currentLang];
    tray.appendChild(hint);
    setTimeout(() => input.focus(), 200);
  }
}

function submitBool(step, value) {
  clearTray();
  answers[step.key] = value;
  addUserBubble(value ? UI[currentLang].yes : UI[currentLang].no);
  advanceStep();
}

function submitNum(step, input) {
  const raw = input.value.trim();
  if (raw === "") { shakeInput(input); return; }
  const val = parseFloat(raw);
  if (isNaN(val)) { shakeInput(input); return; }
  const err = step.validate(val);
  if (err) { showInlineError(err, input); return; }
  clearTray();
  answers[step.key] = step.key === "bmi" ? val : Math.round(val);
  addUserBubble(step.display(answers[step.key]));
  advanceStep();
}

function shakeInput(input) {
  input.style.borderColor = "#e57373"; input.focus();
  setTimeout(() => { input.style.borderColor = ""; }, 1500);
}
function showInlineError(msg, input) {
  let existing = tray.querySelector(".inline-error");
  if (!existing) { existing = document.createElement("p"); existing.className = "hint inline-error"; tray.appendChild(existing); }
  existing.textContent = msg; input.style.borderColor = "#e57373"; input.focus();
  setTimeout(() => { existing.remove(); input.style.borderColor = ""; }, 2500);
}

function advanceStep() {
  currentStep++;
  if (currentStep < STEPS.length) {
    const step = STEPS[currentStep];
    showTyping();
    setTimeout(() => {
      removeTyping();
      if (step.intro) addBubble(step.intro[currentLang], "bot", "info");
      setTimeout(() => {
        addBubble(escapeHtml(step.question[currentLang]));
        renderTray(step);
      }, step.intro ? 500 : 0);
    }, 600);
  } else {
    submitToAPI();
  }
}

/* ═══════════════════════════════════════════════════════════════
   Final submission
   ═══════════════════════════════════════════════════════════════ */
async function submitToAPI() {
  showTyping();
  addBubble(escapeHtml(UI[currentLang].thinking));
  try {
    const payload = Object.assign({ name: userName, language: currentLang, consent: true, screening_code: trackingCode }, answers);
    const res = await fetch(`${API_BASE}/screen`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error(`Server returned ${res.status}`);
    const data = await res.json();
    lastResult = data;
    removeTyping();

    const whyId = "why-" + Date.now();
    addBubble(
      `${escapeHtml(data.message)}
       <button class="why-toggle" id="${whyId}" aria-expanded="false">${UI[currentLang].why}</button>
       <div class="why-text" id="${whyId}-text" hidden>${escapeHtml(data.why || "")}</div>`,
      "bot", "result"
    );
    const toggleBtn = document.getElementById(whyId);
    const whyText = document.getElementById(`${whyId}-text`);
    toggleBtn.addEventListener("click", () => {
      const expanded = toggleBtn.getAttribute("aria-expanded") === "true";
      toggleBtn.setAttribute("aria-expanded", String(!expanded));
      whyText.hidden = expanded;
    });

    if (data.screening_code) {
      trackingCode = data.screening_code;
      saveDevice(data.screening_code, userName);
      setTimeout(() => {
        addBubble(
          `${UI[currentLang].yourCode}: <strong style="letter-spacing:2px;">${escapeHtml(data.screening_code)}</strong><br/><span style="font-size:.85em;">${escapeHtml(UI[currentLang].saveCode)}</span>`,
          "bot", "info"
        );
      }, 400);
    }

    if (prevSnapshot) {
      const snap = buildComparison(data);
      setTimeout(() => addBubble(snap, "bot", "info"), 800);
      prevSnapshot = null;
    }

    setTimeout(() => {
      showTyping();
      setTimeout(() => {
        removeTyping();
        const sRow = document.createElement("div");
        sRow.style.textAlign = "center";
        const sb = document.createElement("button");
        sb.className = "restart-btn";
        sb.textContent = UI[currentLang].summaryBtn;
        sb.onclick = openSummary;
        sRow.appendChild(sb);
        chat.appendChild(sRow);
        addBubble(UI[currentLang].closing);
        setTimeout(() => {
          const restartRow = document.createElement("div");
          restartRow.style.textAlign = "center";
          const rb = document.createElement("button");
          rb.className = "restart-btn"; rb.textContent = UI[currentLang].restart;
          rb.onclick = restartApp;
          restartRow.appendChild(rb);
          chat.appendChild(restartRow);
          scrollToBottom();
        }, 500);
      }, 900);
    }, 900);

  } catch (e) {
    removeTyping();
    addBubble(UI[currentLang].sendError, "bot", "error-bubble");
    const rb = document.createElement("button");
    rb.className = "restart-btn"; rb.textContent = UI[currentLang].tryAgain;
    rb.onclick = restartApp;
    chat.appendChild(rb);
    scrollToBottom();
  }
}

const SUM = {
  en: { title:"PCOSense Sanjivani – Screening Summary",
        note:"For discussion with a doctor. This is NOT a diagnosis.",
        name:"Name", date:"Date", code:"Tracking code", answers:"My answers",
        yes:"Yes", no:"No", result:"Screening result", why:"What contributed",
        ask:"Questions I can ask the doctor",
        qs:["Could my symptoms have another cause?","Do I need any blood tests or a scan?",
            "What lifestyle changes would help?","When should I come back for a check-up?"],
        foot:"Generated by PCOSense Sanjivani, an awareness tool. It does not replace medical advice.",
        labels:{age:"Age",years_since_menarche:"Years since first period",bmi:"BMI",
          acne:"Acne",irregular_periods:"Irregular periods",facial_hair_growth:"Extra facial/body hair",
          weight_gain:"Weight gain",bloating:"Bloating",hair_thinning:"Hair thinning",
          fatigue:"Tiredness / fatigue",family_history:"Family history of PCOS",
          blood_glucose_flag:"High blood sugar noted"} },
  mr: { title:"PCOSense Sanjivani – तपासणी सारांश",
        note:"डॉक्टरांशी चर्चेसाठी. हे निदान नाही.",
        name:"नाव", date:"दिनांक", code:"ट्रॅकिंग कोड", answers:"माझी उत्तरे",
        yes:"होय", no:"नाही", result:"तपासणी निकाल", why:"कशामुळे हा निकाल",
        ask:"डॉक्टरांना विचारायचे प्रश्न",
        qs:["माझ्या लक्षणांची दुसरी कारणे असू शकतात का?","रक्त तपासणी किंवा स्कॅन करावे लागेल का?",
            "जीवनशैलीत कोणते बदल उपयोगी ठरतील?","पुन्हा तपासणीसाठी कधी यावे?"],
        foot:"PCOSense Sanjivani हे जागरूकता साधन आहे. ते वैद्यकीय सल्ल्याची जागा घेत नाही.",
        labels:{age:"वय",years_since_menarche:"पहिल्या पाळीपासूनची वर्षे",bmi:"BMI",
          acne:"मुरुमे",irregular_periods:"अनियमित पाळी",facial_hair_growth:"चेहऱ्यावर/शरीरावर जास्त केस",
          weight_gain:"वजन वाढ",bloating:"पोट फुगणे",hair_thinning:"केस पातळ होणे",
          fatigue:"थकवा",family_history:"कुटुंबात PCOS",blood_glucose_flag:"रक्तातील साखर जास्त"} }
};

function openSummary() {
  const t = SUM[currentLang];
  const rows = Object.keys(t.labels).filter(k => k in answers).map(k => {
    const v = answers[k];
    const val = typeof v === "boolean" ? (v ? t.yes : t.no) : v;
    return `<tr><td>${escapeHtml(t.labels[k])}</td><td><b>${escapeHtml(String(val))}</b></td></tr>`;
  }).join("");
  const date = new Date().toLocaleDateString(currentLang === "mr" ? "mr-IN" : "en-IN");
  const html = `<!doctype html><html><head><meta charset="utf-8"><title>${t.title}</title>
  <style>
    body{font-family:system-ui,"Noto Sans Devanagari",sans-serif;max-width:720px;margin:24px auto;padding:0 20px;color:#222}
    h1{font-size:22px;margin:0 0 4px;color:#0f766e} .note{background:#fff7e6;border:1px solid #f0c36d;padding:8px 12px;border-radius:8px;font-weight:600;margin:10px 0 16px}
    h2{font-size:15px;margin:18px 0 6px;border-bottom:1px solid #ddd;padding-bottom:3px}
    table{width:100%;border-collapse:collapse} td{padding:5px 8px;border-bottom:1px solid #eee;font-size:14px}
    .meta{font-size:13px;color:#555} li{margin:4px 0;font-size:14px} .foot{margin-top:22px;font-size:11px;color:#777}
    @media print{body{margin:0}}
  </style></head><body>
  <h1>${t.title}</h1><div class="note">${t.note}</div>
  <div class="meta">${t.name}: ${escapeHtml(userName)} &nbsp;|&nbsp; ${t.date}: ${date}
    ${trackingCode ? `&nbsp;|&nbsp; ${t.code}: ${escapeHtml(trackingCode)}` : ""}</div>
  <h2>${t.answers}</h2><table>${rows}</table>
  <h2>${t.result}</h2><p>${escapeHtml((lastResult && lastResult.message) || "")}</p>
  ${lastResult && lastResult.why ? `<p class="meta"><b>${t.why}:</b> ${escapeHtml(lastResult.why)}</p>` : ""}
  <h2>${t.ask}</h2><ul>${t.qs.map(q => `<li>${q}</li>`).join("")}</ul>
  <div class="foot">${t.foot}</div>
  <script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>`;
  const w = window.open("", "_blank");
  if (!w) { alert("Please allow pop-ups to download the summary."); return; }
  w.document.write(html); w.document.close();
}

function restartApp() {
  currentStep = -1; answers = {}; userName = "Friend"; trackingCode = null; prevSnapshot = null;
  chat.innerHTML = ""; clearTray();
  boot();
}

/* ═══════════════════════════════════════════════════════════════
   Initial language choice, then boot
   ═══════════════════════════════════════════════════════════════ */
function chooseLangAndStart() {
  addBubble("Hi! / नमस्कार! 👋 Please choose your language / कृपया तुमची भाषा निवडा:");
  tray.innerHTML = ""; tray.classList.remove("hidden");
  const row = document.createElement("div");
  row.className = "yn-row";
  const enBtn = document.createElement("button");
  enBtn.className = "yn-btn yes"; enBtn.textContent = "English";
  enBtn.onclick = () => { setLangUI("en"); clearTray(); addUserBubble("English"); boot(); };
  const mrBtn = document.createElement("button");
  mrBtn.className = "yn-btn no"; mrBtn.textContent = "मराठी";
  mrBtn.onclick = () => { setLangUI("mr"); clearTray(); addUserBubble("मराठी"); boot(); };
  row.appendChild(enBtn); row.appendChild(mrBtn);
  tray.appendChild(row);
}

chooseLangAndStart();
</script>
